<!DOCTYPE html>
<html>
<head>
  <title>For The Moment</title>
  <style>
    body {
      font-family: Georgia, serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: #faf7f2;
      color: #333;
    }

    header {
      padding: 80px 20px;
      background: white;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    h2 {
      font-weight: normal;
      color: #777;
    }

    section {
      max-width: 800px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .category {
      background: white;
      padding: 20px;
      border-radius: 10px;
      min-width: 150px;
    }
  </style>
</head>

<body>

<header>
  <h1>For The Moment</h1>
  <h2>by Amanda Turner</h2>
  <p>Beauty • Food • Travel</p>
</header>

<section>
  <h3>Welcome</h3>

  <p>
    Welcome to For The Moment, a lifestyle blog sharing beauty favorites,
    travel inspiration, restaurant discoveries, recipes and everyday moments.
  </p>

  <div class="categories">
    <div class="category">Beauty</div>
    <div class="category">Food</div>
    <div class="category">Travel</div>
  </div>
</section>

</body>
</html>
